<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" />
        </svg>
      </div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in to manage your Ekub savings circles</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="alert alert-danger">
      <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
          placeholder="e.g. abebe@ekubcircle.com"
        />
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="invalid-feedback">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email address</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          placeholder="••••••••"
        />
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="invalid-feedback">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        <span *ngIf="isLoading">Logging in...</span>
        <span *ngIf="!isLoading">Log In to EkubCircle</span>
      </button>
    </form>

    <div class="auth-divider">
      <span>or sign in with demo account</span>
    </div>

    <!-- Demo Quick-Fill Buttons -->
    <div class="demo-buttons">
      <button type="button" (click)="fillDemoUser('abebe@ekubcircle.com')" class="demo-btn">
        <span class="demo-role organizer">Organizer</span>
        <strong>Abebe Bikila</strong>
      </button>
      <button type="button" (click)="fillDemoUser('almaz@ekubcircle.com')" class="demo-btn">
        <span class="demo-role organizer">Organizer</span>
        <strong>Almaz Ayana</strong>
      </button>
      <button type="button" (click)="fillDemoUser('haile@ekubcircle.com')" class="demo-btn">
        <span class="demo-role member">Member</span>
        <strong>Haile Gebrselassie</strong>
      </button>
      <button type="button" (click)="fillDemoUser('derartu@ekubcircle.com')" class="demo-btn">
        <span class="demo-role member">Member</span>
        <strong>Derartu Tulu</strong>
      </button>
    </div>

    <div class="auth-footer">
      Don't have an account yet? <a routerLink="/register">Register with Fayda FAN</a>
    </div>
  </div>
</div>
